id: LDI-EX-0008
status: approved
type: infrastructure
task_class: cross_system
priority: normal
objective: >-
  Prove actual local worker task execution by creating the deterministic proof
  artifact requested by the control plane.
worker:
  preferred: codex
  fallback: cursor
  run_class: HIGH
  model: null
ownership:
  allowed_paths:
    - tasks/examples/worker-execution-proof/**
    - reports/**
  forbidden_paths:
    - game/**
    - design/**
    - assets/**
    - Packages/**
    - ProjectSettings/**
  write_locks: []
services:
  unity_mcp: false
  meshy: false
  tripo: false
  krea: false
  rokoko: false
  cascadeur: false
  elevenlabs: false
budget:
  paid_credits_allowed: false
  max_estimated_cost_usd: 0
  max_generation_attempts: 0
proof_task:
  objective: >-
    Create a deterministic JSON artifact under tasks/examples/worker-execution-proof/
    proving that the worker received the task id and objective, followed
    repository restrictions, and completed the requested safe action.
  permitted_effect:
    - tasks/examples/worker-execution-proof/**
  forbidden_effect:
    - all paths outside the proof directory except reports/** generated by the control plane
acceptance:
  - proof JSON exists under tasks/examples/worker-execution-proof/
  - proof JSON includes the task id and objective
  - no forbidden paths are modified
