id: LDI-INFRA-0004
status: approved
priority: high
created_at: 2026-09-09
updated_at: 2026-09-09

task_class: cross_system

objective: >-
  Upgrade the Looming Dark control plane from version-probe dispatch to actual
  task execution. The selected local worker must receive a real approved task
  packet plus authoritative repository context, perform one repository-safe
  implementation task, and return a structured completion result that the
  control plane records and validates. This milestone must remain isolated from
  Unity, asset generation, design files, package changes, and paid services.

scope:
  area: infrastructure
  system: control-plane
  task_type: cross_system

worker:
  preferred: codex
  fallback: cursor
  run_class: HIGH
  model: null

inputs:
  specs:
    - AGENTS.md
    - CONSTRUCTION.md
    - control-plane/ARCHITECTURE.md
    - control-plane/ROUTING.yaml
    - control-plane/README.md
    - control-plane/ldi.py
  references:
    - tasks/templates/task.yaml
    - tasks/approved/LDI-INFRA-0003-live-worker-dispatch.yaml
    - tasks/examples/valid-live-dispatch-proof.yaml
  dependencies:
    - LDI-INFRA-0003

ownership:
  allowed_paths:
    - control-plane/**
    - scripts/**
    - tests/control-plane/**
    - tasks/examples/**
    - reports/**
  forbidden_paths:
    - game/**
    - design/**
    - assets/**
    - Packages/**
    - ProjectSettings/**
  write_locks: []

services:
  unity_mcp: false
  meshy: false
  tripo: false
  krea: false
  rokoko: false
  cascadeur: false
  elevenlabs: false

budget:
  paid_credits_allowed: false
  max_estimated_cost_usd: 0
  max_generation_attempts: 0

requirements:
  - Preserve existing dry-run planning, worker discovery, version-probe behavior, and tests.
  - Add a real task-execution path behind --execute that passes the selected worker a structured instruction derived from the approved task packet.
  - Worker input must include task id, objective, acceptance criteria, allowed paths, forbidden paths, authoritative repo rules, and completion-report requirements.
  - Do not shell-interpolate task or model content. Use argument arrays, stdin, temporary files, or another safe non-shell mechanism.
  - Keep worker-specific command construction isolated in adapters.
  - The control plane must not depend on a worker-specific prose response format when a structured response mode is available.
  - Capture worker stdout/stderr, exit status, duration, command identity, task result, files changed when determinable, validation results, warnings, unresolved items, and report path.
  - Never include secrets, tokens, credentials, environment dumps, or authentication material in reports.
  - Reject draft/unapproved tasks exactly as in LDI-INFRA-0003.
  - Respect paid_credits_allowed=false. Do not invoke paid generation APIs or infer spending permission.
  - Do not invoke Unity, Meshy, Tripo, Krea, Rokoko, Cascadeur, ElevenLabs, or any external asset service.
  - Do not give Claude write ownership in this milestone; Claude remains review-first.
  - No automatic premium-worker retry or failover yet. Failed execution should be reported with a recommended next route.
  - Add a repository-safe proof task whose only permitted implementation effect is creation or update of a disposable file under tasks/examples/ or reports/.
  - The proof task must demonstrate that the worker received and followed actual task instructions rather than merely answering --version.
  - Validate the proof by checking the expected repository-safe output and report contents.
  - Preserve exclusive-file conflict detection for future Unity work even though this task does not touch Unity.

proof_task:
  objective: >-
    Create a deterministic text or JSON artifact under tasks/examples/ proving
    that the worker received the task id and objective, followed repository
    restrictions, and completed the requested safe action.
  permitted_effect:
    - tasks/examples/worker-execution-proof/**
  forbidden_effect:
    - all paths outside the proof directory except reports/** generated by the control plane

acceptance:
  - Existing 24 control-plane tests still pass.
  - New tests cover real instruction construction, approved-task execution gating, safe argument/stdin handling, worker response capture, expected-output validation, and failure reporting.
  - `python3 scripts/ldi --workers` still works without invoking workers.
  - Dry-run remains the default and performs no worker invocation.
  - A new approved safe proof task is dispatched to Codex through the adapter and Codex receives actual task instructions.
  - The proof worker creates or updates only the explicitly allowed disposable proof path.
  - The control plane verifies the expected proof output exists and records validation success in the execution report.
  - The execution report clearly distinguishes worker invocation success from task acceptance success.
  - No Unity, design, asset, package, project-settings, or paid-service changes occur.
  - No new package is installed unless separately authorized before installation.

validation:
  compile_required: false
  unity_console_clean: false
  tests:
    - python3 -m py_compile control-plane/ldi.py scripts/ldi tests/control-plane/test_ldi.py
    - python3 scripts/ldi --self-test
    - python3 scripts/ldi --workers
    - one approved safe real-task execution proof
    - git diff --check

completion_report:
  files_changed: []
  checks_performed: []
  warnings: []
  unresolved: []
  follow_up_tasks: []
