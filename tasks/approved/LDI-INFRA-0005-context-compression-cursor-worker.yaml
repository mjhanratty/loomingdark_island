id: LDI-INFRA-0005
status: approved
priority: high
created_at: 2026-09-09
updated_at: 2026-09-09

task_class: cross_system

objective: >-
  Reduce worker-token waste by replacing repeated embedded repository documents
  with compact instructions that tell workers which authoritative files to read
  locally, and make Cursor's current `agent` CLI a first-class executable worker
  in the Looming Dark control plane. Prove one safe Cursor execution if the CLI
  is already installed/authenticated; otherwise implement and validate the
  adapter and report the single concrete installation/authentication blocker.

scope:
  area: infrastructure
  system: control-plane
  task_type: cross_system

worker:
  preferred: codex
  fallback: cursor
  run_class: LOW
  model: null

ownership:
  allowed_paths:
    - control-plane/**
    - scripts/**
    - tests/control-plane/**
    - tasks/examples/**
    - reports/**
  forbidden_paths:
    - game/**
    - design/**
    - assets/**
    - Packages/**
    - ProjectSettings/**

budget:
  paid_credits_allowed: false
  max_estimated_cost_usd: 0
  max_generation_attempts: 0

requirements:
  - Preserve current Codex execution behavior and all existing tests.
  - Stop embedding full AGENTS.md, CONSTRUCTION.md, and other repository files into every worker prompt.
  - Instead send compact invariant rules plus repository-relative paths the worker must read before editing.
  - Keep task objective, acceptance criteria, allowed/forbidden paths, budget restrictions, and completion-report schema explicit in the worker instruction.
  - Add a measurable before/after instruction-size test proving material context reduction.
  - Correct Cursor discovery to use the current official CLI executable `agent`, not `cursor`.
  - Implement Cursor non-interactive execution using current official CLI semantics: `agent -p` with structured output where supported.
  - Keep Cursor command construction isolated in CursorAdapter; do not couple it to CodexAdapter.
  - Missing/unauthed Cursor must fail closed with one concise blocker; do not silently fall back and consume Codex quota during the proof.
  - Do not install packages or CLIs in this task unless already present and install-free discovery is possible.
  - Do not change Grok/model routing yet.
  - Do not touch Unity or production game content.
  - Complete the full delivery lifecycle automatically: sync main, create task branch, implement, validate, commit, push, open PR, and return the PR link. Do not ask the user to run Git commands.

acceptance:
  - existing control-plane tests remain green
  - new tests verify compact context does not embed full authoritative documents
  - new tests quantify instruction-size reduction
  - `--workers` checks Cursor via `agent`
  - CursorAdapter builds a safe non-interactive argument array using `agent -p`
  - if local Cursor CLI is available and authenticated, one approved safe task executes through Cursor and produces an accepted report
  - if unavailable or unauthenticated, adapter/tests still pass and the completion report identifies only the concrete blocker without consuming extra Codex retries
  - no Unity/design/assets/packages/project-settings changes

validation:
  compile_required: false
  unity_console_clean: false
  tests:
    - python3 -m py_compile control-plane/ldi.py scripts/ldi tests/control-plane/test_ldi.py
    - python3 scripts/ldi --self-test
    - python3 scripts/ldi --workers
    - git diff --check

completion_report:
  files_changed: []
  checks_performed: []
  warnings: []
  unresolved: []
  follow_up_tasks: []
